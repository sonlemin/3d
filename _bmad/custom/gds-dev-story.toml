# Team override for gds-dev-story (Sonlm, 2026-11-20).
# At the end of every story: run the manual checks that can be judged from the screen on a
# virtual display, record the agent's time, commit the story on the current branch and push it
# (Sonlm, 2026-11-26: "push next time since i clone it to my laptop").

[workflow]

activation_steps_append = [
  "Run `date '+%Y-%m-%d %H:%M %z'` and keep the result as the story's agent start time, for the hours line at the end.",
]

on_complete = """
Before the final message to Sonlm, do these four steps in this order.

1. Manual checks, automatically where possible. For each manual check the story lists (M1, M2, ...):
   - If it can be judged from what is on screen, run it on a virtual display and write frames:
       xvfb-run -a -s "-screen 0 1280x720x24" godot --path game [<scene>] --write-movie <scratchpad>/<check id>/frame.png --fixed-fps 30 --quit-after <frames> [-- <switches>]
     Launch switches go last, after `--`: everything after `--` is handed to the game, so an engine flag put there writes no frames and never quits.
     For an exported build, run the binary with the same xvfb-run and --write-movie flags. Use a `--show=<name>` setup once those exist. Read the last frames (and any frame the check needs), judge them against the check, and note which frame you judged. The renderer is Forward+ on llvmpipe (CPU Vulkan), not a real GPU: say so beside the result.
   - Sound, panning, feel, mouse capture, frame rate and the window title cannot be judged this way. List them for Sonlm as NOT verified. Never report such a check, or any part of one, as verified.
   - Write each result into the story's Completion Notes: "Mn: verified on a virtual display (<frame path>)" or "Mn: NOT verified, needs Sonlm (<why>)".

2. Hours. Run `date '+%Y-%m-%d %H:%M %z'` again. In Completion Notes, write "Agent time: <start> to <end> (<h> h <m> min), measured by the agent." Do not add a line for Sonlm's own hours: since the epic 1 retrospective (2026-11-27), Sonlm gives one rough number per epic at its retrospective instead.

3. Commit. Stage exactly the files in the story's File List (with their .uid files), plus the story file and sprint-status.yaml, and nothing else. Commit on the current branch with the message "Story <id>: <title>", ending with the attribution lines the session gives. If the current branch is main, create a branch first. The pre-commit hook runs tools/ci.sh: if it fails, fix the cause, rerun, and commit again. Never use --no-verify and never amend an earlier commit.

4. Push. Sonlm gets the work onto the laptop by git, so a commit that is not pushed cannot be tested there. Run `git push origin <current branch>` (the branch only: never main, never a force push, never tags). If the push fails (the stored token expires 2026-12-25), say so plainly and ask Sonlm for a new token; do not work around it. The repository is public: if the commit holds anything Sonlm may want private, say so and ask before pushing. Tell Sonlm the commit hash and that it is pushed.
"""
